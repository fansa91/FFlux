name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'

jobs:
  xaml-lint:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run XAML style check
        run: ./scripts/lint-xaml.ps1

  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-test-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-test-

      - name: Build tests
        run: msbuild Screenbox.Core.Tests\Screenbox.Core.Tests.csproj -p:Configuration=Release -p:Platform=x64 -p:OutDir=C:\BuildOutput\ -restore

      - name: Run tests
        run: C:\BuildOutput\Screenbox.Core.Tests.exe

  build:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    env:
      APP_PROJ_PATH: Screenbox
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update project version
        run: ./scripts/Update-ProjectVersion.ps1

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build unpackaged app
        run: |
          msbuild $env:APP_PROJ_PATH/Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true

      - name: Upload unpackaged app artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenbox-unpackaged-win-x64
          path: ${{ env.APP_PROJ_PATH }}/bin/x64/Release/**/Screenbox.exe
          archive: false
