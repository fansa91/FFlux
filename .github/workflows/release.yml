name: Release

# The only pipeline in this repository. Pushing a vX.Y.Z tag builds both
# distributions and publishes them on the GitHub release for that tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJ_PATH: FFlux

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 不依赖：自带 .NET 运行时，解压即用
          - flavour: self-contained
            self_contained: true
            publish_aot: true
          # 依赖：体积小，需要机器上装好 .NET 桌面运行时。
          # AOT 必须一起关掉——Native AOT 产出的是自带运行时的原生 exe，
          # 打开 AOT 再设 SelfContained=false 只会得到一个仍然不依赖运行时的包，
          # 和上面那个没区别，所以这里只能二选一。
          - flavour: framework-dependent
            self_contained: false
            publish_aot: false
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version
        id: app_version
        shell: pwsh
        env:
          VERSION_REF: ${{ inputs.version || github.ref_name }}
        run: |
          # Accepts "0.1.0" (manual run) and "v0.1.0" (tag push). MAJOR.MINOR.PATCH only.
          $version = $env:VERSION_REF -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Invalid version '$env:VERSION_REF'. Use vMAJOR.MINOR.PATCH, for example v0.1.0."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version to stamp into the app: $version"

      # Version is the only thing the pipeline injects: it lands in the assembly
      # metadata (AssemblyInformationalVersion -> shown on the Settings page), in the
      # exe's file properties, and in the artefact names.
      # WindowsAppSDKSelfContained is NOT passed here on purpose: a -p: value is global
      # and reaches the class libraries too, where Windows App SDK aborts with
      # "WindowsAppSDKSelfContained should not be applied to a class library".
      # It stays true for both flavours through the app project's own default, so the
      # only difference between the two artefacts is whether .NET travels inside.
      - name: Publish ${{ matrix.flavour }}
        shell: pwsh
        run: |
          dotnet publish "$env:APP_PROJ_PATH/FFlux.csproj" `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Version=${{ steps.app_version.outputs.version }} `
            -p:SelfContained=${{ matrix.self_contained }} `
            -p:PublishAot=${{ matrix.publish_aot }} `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishDir="${{ github.workspace }}\artifacts\${{ matrix.flavour }}" `
            --nologo

      # A folder publish does not collect the WinUI runtime assets by itself: the XAML
      # compiler writes App.xbf, the page XBFs and resources.pri straight into the build
      # output, and none of them are MSBuild Content items. The project mirrors them into
      # the publish folder (CopyUnpackagedRuntimeAssetsToPublish), so verify the result
      # here rather than shipping a zip that exits before its first window.
      - name: Verify publish layout
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "artifacts/${{ matrix.flavour }}"
          $required = @(
            'FFlux.exe'
            'App.xbf'
            'resources.pri'
            'Controls/PlayerControls.xbf'
            'Pages/HomePage.xbf'
            'Assets/DefaultAudioVisual.png'
            'Assets/Fonts/ScreenboxFluentIcons.ttf'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $source $_)) }
          if ($missing) {
              throw "Publish output is missing runtime assets: $($missing -join ', ')"
          }
          $count = (Get-ChildItem $source -Recurse -File).Count
          "Publish layout OK: $count files"

      # Best-effort runtime proof: start the published folder and wait for the startup
      # heartbeat written by Program.cs. Deliberately non-blocking, because a hosted runner
      # may lack the desktop or graphics stack WinUI 3 wants; the layout check above is the
      # hard gate and the log is printed either way.
      - name: Smoke test ${{ matrix.flavour }}
        shell: pwsh
        continue-on-error: true
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "artifacts/${{ matrix.flavour }}"
          $log = Join-Path $env:LOCALAPPDATA 'FFlux\startup-error.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:FFLUX_STARTUP_TRACE = '1'

          $proc = Start-Process -FilePath (Join-Path $source 'FFlux.exe') -WorkingDirectory $source -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $proc.HasExited
          if ($alive) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

          $beats = 0
          if (Test-Path $log) {
              $beats = @(Select-String -Path $log -Pattern 'heartbeat' -SimpleMatch).Count
              Get-Content $log -Tail 30
          }
          "alive=$alive heartbeats=$beats"
          if (-not $alive -or $beats -lt 3) { throw "Application did not reach a running state." }

      - name: Package ${{ matrix.flavour }}
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "artifacts/${{ matrix.flavour }}"
          $name = "FFlux-${{ steps.app_version.outputs.version }}-win-x64-${{ matrix.flavour }}"
          $zip = Join-Path $env:GITHUB_WORKSPACE "$name.zip"

          if (-not (Test-Path (Join-Path $source "FFlux.exe"))) {
              throw "Publish output does not contain FFlux.exe: $source"
          }

          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $zip -CompressionLevel Optimal
          "$name.zip: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      - name: Upload ${{ matrix.flavour }}
        uses: actions/upload-artifact@v7
        with:
          name: FFlux-${{ matrix.flavour }}
          path: FFlux-${{ steps.app_version.outputs.version }}-win-x64-${{ matrix.flavour }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -lh dist

          # Build the "what changed" section from commits since the previous release tag.
          # checkout fetched full history and all tags, so git is the source of truth here.
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -v "^v${VERSION}$" \
            | sort -V \
            | tail -n 1)"
          # On a tag push the ref exists locally. workflow_dispatch may name a version that
          # has no tag yet; in that case use HEAD (the dispatch ref) as the range end.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            RANGE_END="v${VERSION}"
          else
            RANGE_END="HEAD"
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${RANGE_END}"
          else
            RANGE="$RANGE_END"
          fi

          {
            echo "同一个 FFlux $VERSION，两种打包方式，功能完全一致。"
            echo
            echo "## 更新内容"
            echo
            COMMITS="$(git log --no-merges --pretty=format:'- %s' "$RANGE")"
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- 无代码变更（仅重新打包）"
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "完整变更：[$PREVIOUS_TAG...v$VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...v$VERSION)"
            fi
            echo
            echo "## 下载"
            echo
            echo "| 下载 | 运行时要求 |"
            echo "| --- | --- |"
            echo "| \`FFlux-$VERSION-win-x64-self-contained.zip\` | 无。解压后直接运行 \`FFlux.exe\` |"
            echo "| \`FFlux-$VERSION-win-x64-framework-dependent.zip\` | 需预装 .NET 10 桌面运行时（Windows App SDK 已随包提供） |"
            echo
            echo "系统要求：Windows 10 1903（build 18362）及以上，x64。"
          } > notes.md

          cat notes.md

          # A tag can be re-pointed at a fixed commit, which leaves the previous release
          # sitting on the same tag name. Replace it instead of failing with "already exists".
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "v$VERSION" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFlux v$VERSION" \
            --notes-file notes.md
