name: Build unpackaged app

on:
  workflow_dispatch:
    inputs:
      detail_level:
        description: 'Choose MSBuild level of detail'
        required: true
        default: 'normal'
        type: choice
        options:
          - quiet
          - minimal
          - normal
          - detailed
          - diagnostic

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    env:
      APP_PROJ_PATH: Screenbox
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update project version
        run: ./scripts/Update-ProjectVersion.ps1

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish unpackaged app
        run: |
          msbuild $env:APP_PROJ_PATH/Screenbox.csproj `
            -restore `
            -t:Publish `
            -v:${{ inputs.detail_level }} `
            -p:RestoreConfigFile=nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true

      - name: Upload unpackaged app artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenbox-unpackaged-win-x64
          path: ${{ env.APP_PROJ_PATH }}/bin/Release/**/publish/**
          archive: false
